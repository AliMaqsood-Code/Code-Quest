<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArena – Practice Platform (Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="auth"></div>
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#/dashboard"><span class="logo">{ }</span>CodeArena</a>
    <div class="sec">Workspace</div><nav id="links"></nav>
    <a href="#/profile" class="me" id="me"></a>
    <button id="logout" class="btn btn-ghost btn-sm mt-2">Log out</button>
  </aside>
  <div class="main">
    <header class="top">
      <button id="menu" class="icon-btn d-lg-none"></button>
      <div class="crumb" id="crumb"></div>
      <label class="search d-none d-md-flex"><span id="s-ico"></span><input id="gs" placeholder="Search problems…"><kbd>↵</kbd></label>
      <a href="#/notifications" class="icon-btn position-relative" id="bell"><span id="notif-count" class="dot"></span></a>
      <button id="theme" class="icon-btn" title="Toggle theme"></button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/auth.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/problems.js"></script>
<script src="js/pages/contests.js"></script>
<script src="js/pages/community.js"></script>
<script src="js/pages/learning.js"></script>
<script src="js/pages/teams.js"></script>
<script src="js/pages/profile.js"></script>
<script>App.start();</script>
</body>
</html>
